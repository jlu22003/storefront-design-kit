name: Catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog:
    name: Catalog (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The engines floor in package.json, and the current LTS.
        node: ['22.12.0', 'lts/*']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Dev dependencies are Stylelint, PostCSS, Playwright, and axe-core; the catalog, token,
      # and playground tooling use Node built-ins. No browsers are installed here.
      - name: Install dev dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Lint CSS
        run: npm run lint:css
      - name: Generated docs are up to date
        run: npm run catalog:docs:check
      - name: Generated tokens are up to date
        run: npm run tokens:check
      # Lists the Playwright suite (no browsers needed) and runs the node tests. The
      # enforcing gate runs in the e2e job, on the report of a real Playwright run.
      - name: Coverage report
        run: npm run catalog:check

  e2e:
    name: Playwright PR smoke and coverage gate
    runs-on: ubuntu-latest
    # The pinned image is the renderer for the visual baselines: same browsers, fonts, and OS
    # as `npm run test:e2e:docker`. Its tag must match @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      SDK_PINNED_RENDERER: '1'
      # Browsers in the image expect HOME to be root's when the job runs as root.
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - name: Install dev dependencies
        run: npm ci
      - name: Playwright
        run: npx playwright test
      - name: Coverage gate (enforcing)
        if: ${{ !cancelled() }}
        run: npm run catalog:check -- --enforce --playwright-report reports/playwright.json --json reports/catalog-coverage.json
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            reports/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
