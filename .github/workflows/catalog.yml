name: Catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog:
    name: Catalog (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The engines floor in package.json, and the current LTS.
        node: ['22.12.0', 'lts/*']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # No dependencies to install: the catalog tooling uses Node built-ins only.
      - name: Unit tests
        run: npm test
      - name: Generated docs are up to date
        run: npm run catalog:docs:check
      - name: Coverage gate (report-only)
        run: npm run catalog:check
