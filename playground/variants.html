<!doctype html>
<html lang="en" data-sdk-panel="off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Variant board · storefront-design-kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="/theme/assets/sdk-tokens.css">
<link rel="stylesheet" href="/theme/assets/sdk-base.css">
<link rel="stylesheet" href="/theme/assets/sdk-primitives.css">
<link rel="stylesheet" href="/playground/assets/sketch.css">
<link rel="stylesheet" href="/playground/assets/tools.css">
</head>
<!--
  Variant board: two to four copies of one page side by side. Each copy has
  its own design panel under it, saved separately, so you can try different
  spacing, type, corners, and colors, mark a winner, and copy its CSS.
  The page's own floating Design button is off (data-sdk-panel="off").
-->
<body>
<header class="pg-toolbar">
  <div class="sdk-center sdk-stack" data-gutter style="--measure: 120rem; --padding-block: var(--sdk-space-16); --child-gap: var(--sdk-space-12)">
    <div class="sdk-cluster" data-align-y="center" style="--child-gap: var(--sdk-space-12)">
      <a class="sdk-text-footnote" href="/playground/">Playground</a>
      <h1 class="sdk-text-title-2">Variant board</h1>
    </div>
    <div class="sdk-cluster" data-align-y="end" style="--child-gap: var(--sdk-space-24)">
      <form id="source" class="sdk-stack" style="--child-gap: var(--sdk-space-4)">
        <label for="src" class="sdk-text-subhead sdk-text-semibold">Page</label>
        <div class="sdk-cluster" style="--child-gap: var(--sdk-space-8)">
          <input id="src" name="src" class="pg-field" list="pages" size="36" autocomplete="off" spellcheck="false" aria-describedby="src-error">
          <datalist id="pages"></datalist>
          <button class="pg-button" type="submit">Show</button>
        </div>
        <p id="src-error" class="sdk-text-footnote pg-error" data-error role="alert"></p>
      </form>
      <div class="sdk-stack" style="--child-gap: var(--sdk-space-4)">
        <label for="count" class="sdk-text-subhead sdk-text-semibold">Variants</label>
        <select id="count" class="pg-field">
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </div>
      <div class="sdk-stack" style="--child-gap: var(--sdk-space-4)">
        <label for="width" class="sdk-text-subhead sdk-text-semibold">Width</label>
        <select id="width" class="pg-field"></select>
      </div>
      <div class="sdk-stack" style="--child-gap: var(--sdk-space-4)">
        <button id="copy-winner" class="pg-button" type="button" aria-describedby="winner-status">Copy winner's CSS</button>
      </div>
    </div>
    <p id="winner-status" class="sdk-text-footnote sdk-text-secondary" role="status"></p>
    <pre id="winner-css" class="pg-code" tabindex="0" aria-label="Winner's CSS" hidden></pre>
  </div>
</header>

<main class="sdk-center" data-gutter style="--measure: 120rem; --padding-block: var(--sdk-space-32)">
  <ol id="variants" class="pg-variants" aria-label="Variants"></ol>
</main>

<script type="module">
  import { BOARD_WIDTHS } from '/playground/dev/formats.js';
  import { mountDesignPanel } from '/playground/dev/panel.js';
  import { bindSourceForm, copyText } from '/playground/dev/tools.js';
  import { el } from '/playground/dev/util.js';

  const LETTERS = ['A', 'B', 'C', 'D'];
  const WINNER_KEY = 'sdk-playground-board-winner';
  const params = new URLSearchParams(location.search);
  const src = bindSourceForm(document.querySelector('#source'), { copies: false });
  const board = document.querySelector('#variants');
  const countSelect = document.querySelector('#count');
  const widthSelect = document.querySelector('#width');
  const status = document.querySelector('#winner-status');
  const winnerCss = document.querySelector('#winner-css');

  const count = Math.min(4, Math.max(2, Number(params.get('n')) || 2));
  const width = BOARD_WIDTHS.find((w) => w.id === params.get('w')) ?? BOARD_WIDTHS[2];
  countSelect.value = String(count);
  widthSelect.append(...BOARD_WIDTHS.map((w) => el('option', { value: w.id, text: w.label })));
  widthSelect.value = width.id;

  // Count and width live in the address bar, so a board can be bookmarked.
  for (const [select, name] of [[countSelect, 'n'], [widthSelect, 'w']]) {
    select.addEventListener('change', () => {
      const url = new URL(location.href);
      url.searchParams.set(name, select.value);
      location.assign(url);
    });
  }

  let winner = 0;
  try {
    winner = Math.min(count - 1, Number(localStorage.getItem(WINNER_KEY)) || 0);
  } catch {
    // Storage unavailable: start with A.
  }

  const variants = src
    ? LETTERS.slice(0, count).map((letter, index) => {
        const frame = el('iframe', {
          src,
          'data-sdk-embed': 'variant',
          width: width.width,
          title: `Variant ${letter}: ${src}`,
        });
        const viewport = el('div', { class: 'pg-frame-viewport' }, [frame]);
        const radio = el('input', { type: 'radio', name: 'winner', value: String(index), id: `winner-${letter}` });
        radio.checked = index === winner;
        radio.addEventListener('change', () => {
          winner = index;
          try {
            localStorage.setItem(WINNER_KEY, String(index));
          } catch {
            // Not remembered across reloads; still picked for this view.
          }
          status.textContent = `Variant ${letter} is the winner.`;
        });
        const slot = el('div');
        board.append(
          el('li', { class: 'pg-variant', 'aria-labelledby': `variant-${letter}` }, [
            el('div', { class: 'sdk-cluster', 'data-align-x': 'between', 'data-align-y': 'center', style: '--child-gap: var(--sdk-space-8)' }, [
              el('h2', { id: `variant-${letter}`, class: 'sdk-text-title-3', text: `Variant ${letter}` }),
              el('label', { class: 'pg-choice', for: `winner-${letter}` }, [radio, document.createTextNode('Winner')]),
            ]),
            viewport,
            slot,
          ]),
        );
        const variant = { letter, frame, viewport, panel: null };
        // Each copy gets its own panel and saved settings. When the frame
        // reloads or navigates, the panel follows it to the new document.
        frame.addEventListener('load', () => {
          let root;
          try {
            root = frame.contentDocument?.documentElement;
          } catch {
            root = null;
          }
          if (!root) return;
          if (variant.panel) {
            variant.panel.setRoot(root);
            return;
          }
          variant.panel = mountDesignPanel({
            root,
            container: slot,
            storageKey: `sdk-playground-design:variant-${letter.toLowerCase()}`,
            inline: true,
            title: `Variant ${letter} settings`,
            idPrefix: `sdk-v${letter.toLowerCase()}`,
          });
        });
        return variant;
      })
    : [];
  board.style.setProperty('--count', String(variants.length || 2));

  // Scale each frame to its column; show a window-height slice of the page.
  function layout() {
    for (const { frame, viewport } of variants) {
      const scale = Math.min(1, viewport.clientWidth / width.width) || 1;
      const visible = Math.max(320, Math.round(innerHeight * 0.7));
      frame.style.transform = `scale(${scale})`;
      frame.style.blockSize = `${Math.round(visible / scale)}px`;
      viewport.style.blockSize = `${visible}px`;
    }
  }
  if (variants.length) new ResizeObserver(layout).observe(variants[0].viewport);
  addEventListener('resize', layout);
  layout();

  document.querySelector('#copy-winner').addEventListener('click', () => {
    const variant = variants[winner];
    if (!variant?.panel) {
      status.textContent = 'That variant is still loading.';
      return;
    }
    const css = variant.panel.css().replace('Design panel values.', `Design panel values, variant ${variant.letter}.`);
    copyText(css, { status, fallback: winnerCss });
  });
</script>
</body>
</html>
